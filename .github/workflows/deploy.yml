name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

# Never run two deploys at once; queue them instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with the `worker` crate version in Cargo.lock.
  WORKER_BUILD_VERSION: 0.8.7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deploy:
    needs: test
    # Pull requests only run the tests; deploys happen from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2 # also caches ~/.cargo/bin, so worker-build is only compiled once
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install worker-build
        run: |
          if ! worker-build --version 2>/dev/null | grep -q "$WORKER_BUILD_VERSION"; then
            cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked --force
          fi
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply read-later --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
